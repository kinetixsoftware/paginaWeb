<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Vrision</title>
  <link rel="icon" type="image/png" href="imagenes\Icon.png">
  <link rel="stylesheet" href="..\css\Login.css">
</head>

<body>
  <!-- Menu -->
  <nav class="menu">
    <div class="menu-content">
      <div class="menu-logo">
        <img class="img--logo" src="../imagenes/logo1.png" width="50" height="50" alt="Logo Vrision">
      </div>
   
    <ul>
      <li><a href="home.html">Volver</a></li>
      <li>
          <button type="button" id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">🌙 Dark</button>
      </li>
    </ul>
  </nav>

  <!-- Contenedor principal -->
  <section class="login-container">
    <div class="login-box">
      <h2>Client Access</h2>
      <p class="login-subtitle">
        Log in to access be able to access our services.<br>
        <small>(This may not work for a while, we apologize for the inconvenience.)</small>
      </p>

      <form action="#" method="post" class="login-form">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="example123@gmail.com" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="********" required>
        </div>

        <button type="submit" class="btn-login">Log in</button>
      </form>

      <p class="login-footer">
        Don't have an account? <a href="Error.html">Register here!</a>
      </p>
    </div>
  </section>

  <!-- Pie de página -->
  <footer class="footer">
    <p>© 2025 Vrision. All rights reserved.</p>
  </footer>

  <script>
    const themeToggle = document.getElementById('themeToggle');

    function applyTheme(theme) {
      const body = document.body;
      const isDark = theme === 'dark';
      body.classList.toggle('dark-mode', isDark);
      body.classList.toggle('light-mode', !isDark);
      themeToggle.textContent = isDark ? '☀️ Light' : '🌙 Dark';
      themeToggle.setAttribute('aria-label', isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
    }

    const savedTheme = localStorage.getItem('theme') || 'dark';
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      const nextTheme = document.body.classList.contains('light-mode') ? 'dark' : 'light';
      applyTheme(nextTheme);
      localStorage.setItem('theme', nextTheme);
    });
  </script>
</body>
</html>
